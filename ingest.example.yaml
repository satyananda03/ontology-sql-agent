# Copy to ingest.yaml to limit what ingestion reads. See docs/connections.md.
# No passwords here: the connection stays in CONNECTION_STRINGS.
databases:
  # The database name from the connection string.
  sales_db:
    # Omit to ingest every schema the database user can read.
    schemas:
      - analytics
    # Table names to skip, in any listed schema.
    exclude_tables:
      - tmp_import
