# Copy to config/ingest.yaml to limit what ingestion reads (auto_ontology/catalog/ingest_config.py).
# No passwords here: the connection stays in CLIENT_DATABASE.
databases:
  # The database name from the connection string.
  sales_db:
    # Omit to ingest every schema the database user can read.
    schemas:
      - analytics
    # Table names to skip, in any listed schema.
    exclude_tables:
      - tmp_import
    # Columns to skip: a name skips it in every table, table.column in one table.
    # Embedding (vector) columns need no entry: they are kept out of the
    # semantic layer by type, and row search by meaning needs them ingested.
    exclude_columns:
      - teks_pencarian_bm25           # nama saja: di semua tabel
      # - dim_layanan.catatan_internal  # tabel.kolom: di satu tabel saja