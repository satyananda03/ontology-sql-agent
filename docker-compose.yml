services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: ontology-sql-agent:latest
    restart: unless-stopped
    # Localhost only: the review routes have no login and trust the caller.
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      # In-network port; POSTGRES_PORT in .env is the host-side mapping.
      POSTGRES_PORT: "5432"
      INGESTION_SERVICE_URL: http://ingestion-service:3002
    depends_on:
      # Without the migration the backend 500s (UndefinedTable) on every
      # catalog call.
      migrate:
        condition: service_completed_successfully
      ingestion-service:
        condition: service_started

  ingestion-service:
    build: .
    image: ontology-sql-agent:latest
    restart: unless-stopped
    command: ["ingestion_service"]
    ports:
      - "127.0.0.1:3002:3002"
    # The image healthcheck targets the backend's :3001; this service serves
    # its own liveness probe on :3002.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3002/health/live', timeout=3).status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      # Which schemas and tables to ingest: copy ingest.example.yaml to
      # ingest.yaml first. Refusing to start without it beats the default of
      # creating an empty directory there, which would ingest everything.
      - type: bind
        source: ./ingest.yaml
        target: /app/ingest.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot: apply the Alembic migrations that own the `public` schema.
  migrate:
    build: .
    image: ontology-sql-agent:latest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
