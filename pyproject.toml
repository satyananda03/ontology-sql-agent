[project]
name = "ontology-sql-agent"
version = "1.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "langchain-openai>=1.3.0,<1.3.5",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pandas>=2.3.3,<3",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "langchain-postgres>=0.0.17",
    "openai==2.44.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-core>=1.6.1",
    "sqlglot>=30.17.0",
    "numpy>=2.5.2",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auto_ontology", "sql_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
constraint-dependencies = [
    "urllib3>=2.8.0",  # BDSA-2026-35861, BDSA-2026-35864 (via requests)
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
release = []

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["auto_ontology", "sql_agent"]
addopts = "--import-mode=importlib"
