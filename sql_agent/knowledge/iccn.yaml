# Business knowledge the ontology cannot infer. Review before applying with:
#   uv run python -m sql_agent.knowledge.import_classic_yaml --dictionary <yaml> --apply
database: iccn_data_lake

relations:
  # Real joins with no foreign key in the database.
  add:
    - source: bridge_pelaku_hki.sumber_pelaku_id
      target: fact_pelaku_ekraf.sumber_id
    - source: fact_event.tanggal_id_mulai
      target: dim_waktu.tanggal_id
  # Inferred edges that are wrong. Disabled rather than deleted, because a deleted
  # edge is inferred again by the next compilation.
  disable:
    - source: detail_program_ip.detail_id
      target: detail_program_kata_kreatif.detail_id
    - source: detail_program_ip_event.detail_id
      target: detail_program_kata_kreatif.detail_id
    - source: detail_program_requestor.account_id
      target: dim_user.user_id

# The classic dictionary predates the wilayah_id foreign keys on the insight tables;
# these replace only the sentences that still say to match kabupaten_kota text.
term_description_overrides:
  dim_wilayah: >-
    Tabel dimensi wilayah, berisi daftar kabupaten/kota beserta provinsinya. Relasi yang
    valid hanya FK wilayah_id dari fact_sebaran_jejaring, fact_insight_ikm, dan
    fact_insight_umkm (JOIN ON <tabel>.wilayah_id = dim_wilayah.wilayah_id), lalu GROUP
    BY provinsi atau kabupaten_kota untuk agregasi per wilayah. Tabel lain yang punya
    kolom wilayah sendiri (mis. fact_pelaku_ekraf) TIDAK terhubung ke tabel ini.
  fact_insight_ikm: >-
    Tabel ini berisi ringkasan industri kecil menengah per kelurahan. Satu baris
    mewakili satu kelurahan, dengan jumlah IKM, jumlah yang berizin, tenaga kerja, nilai
    produksi, investasi, komoditi dominan, dan kategori industri dominan. Kolom jumlah
    sudah berupa agregat, sehingga total lintas kelurahan dihitung dengan SUM.
    wilayah_id terhubung ke dim_wilayah lewat foreign key untuk nama provinsi dan
    kabupaten/kota. Data IKM dapat dibandingkan dengan fact_insight_umkm berdasarkan
    kecamatan dan kelurahan. Gunakan LEFT JOIN jika ingin semua kelurahan IKM tetap
    tampil meskipun tidak ada pasangan di tabel UMKM. Periksa cakupan pada kolom
    kabupaten_kota sebelum menganggap hasilnya mewakili wilayah lain.
  fact_insight_umkm: >-
    Tabel ini berisi ringkasan UMKM per kelurahan. Satu baris mewakili satu kelurahan,
    dengan jumlah UMKM, termasuk jumlah yang aktif, berlegalitas, terlatih, memiliki
    akses modal, dan sudah digital, serta bidang usaha dominan dan kebutuhan utamanya.
    Kolom jumlah sudah berupa agregat, sehingga total lintas kelurahan dihitung dengan
    SUM, bukan COUNT. wilayah_id terhubung ke dim_wilayah lewat foreign key untuk nama
    provinsi dan kabupaten/kota. Data UMKM dapat dibandingkan dengan fact_insight_ikm
    berdasarkan kecamatan dan kelurahan, tetapi tidak semua kelurahan tersedia di kedua
    tabel. Periksa cakupan pada kolom kabupaten_kota sebelum menganggap hasilnya
    mewakili wilayah lain.

sql_attributes:
  - term_table: fact_partisipasi_program
    name: Researcher
    description: >-
      Researcher atau peneliti adalah pendaftar program riset. Namanya ada di
      fact_partisipasi_program.nama_pendaftar dan bidang keahliannya di
      detail_program_riset.field_of_expertise, dihubungkan lewat partisipasi_id.
    expression: >-
      SELECT * FROM "iccn_dwh"."fact_partisipasi_program" WHERE "jenis_program" = 'RISET'

glossary:
  - name: researcher
    description: >-
      Researcher atau peneliti adalah pendaftar dengan jenis_program='RISET' di tabel
      fact_partisipasi_program. Namanya ada di fact_partisipasi_program.nama_pendaftar,
      bidang keahliannya di detail_program_riset.field_of_expertise. JOIN lewat
      partisipasi_id. Bukan member di dim_user.
  - name: dana ICCN
    description: >-
      Data keuangan ICCN (dana hibah, pencairan atau penyaluran dana, anggaran ICCN)
      tidak tersedia. Kolom total_budget dan funding_sources di detail_program_ip_event
      hanyalah anggaran festival yang diisi pendaftar, bukan dana ICCN.
