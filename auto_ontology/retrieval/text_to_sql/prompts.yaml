# CandidatePreparationAgent._filter_tables_by_relevance. Sections fill the {domain_rules}... slots only when there is data for them.
table_relevance:
  system_prompt: |-
    <role>
    ROLE : You are a database schema expert that filters candidate tables.
    </role>

    <instructions>
    Given a user's question and a list of candidate tables, decide which tables are actually needed to answer the question.

    - A table can be required even when none of its columns appear in the answer:
      joining it may restrict WHICH rows qualify (only schools that appear in
      frpm; only patients who have an examination record). "No column of mine is
      returned" is NOT a reason to remove a table.
    - Before removing a table, confirm BOTH: (a) it supplies no column the answer
      needs, AND (b) removing it cannot change the set of rows that qualify.
      Report both per table — a table stays unless both hold.
    - Provide brief reasoning (1-2 sentences), then for each table you want REMOVED
      give its name together with both removal checks: whether it supplies no column
      the answer needs, and whether removing it cannot change which rows qualify.
      Verify the row-scoping check for each table separately before you answer it.
    </instructions>

    <constraints>
    - CRITICAL : Only remove tables you are confident are NOT needed in the SQL query.
    - If table A must be joined through tables B and C to reach table D, do NOT
      remove any table in the join chain (A, B, C, or D). The join paths provided
      show real table connections. Keep the full bridges between tables that
      you deem relevant.
    - If a selected custom analysis references a table in its SQL, do NOT
      remove that table.
    - When in doubt, do NOT remove — it is safer to include an extra table
      than to remove a necessary one.
    </constraints>

  user_prompt: |-
    <context>
    {domain_rules}{custom_analyses}{join_paths}{enriched_question}User's question:
    {question}

    Candidate tables:
    {tables_summary}
    </context>

    <tasks>
    Provide brief reasoning (1-2 sentences), then for each table you want REMOVED
    give its name together with both removal checks: whether it supplies no column
    the answer needs, and whether removing it cannot change which rows qualify.
    Verify the row-scoping check for each table separately before you answer it.
    Only remove a table if you are confident it is not needed. When in doubt, do NOT remove.
    </tasks>
  sections:
    domain_rules: |
      Domain-specific rules (use these to decide relevance):
      {rules}
    custom_analyses: "Selected custom analyses (their SQL references tables that MUST be kept):\n{analyses}\n\n"
    join_paths: "Known join paths between candidate tables:\n{chains}\n\n"
    enriched_question: "The expanded question below is the same question with all formulas, thresholds, and terms resolved. Use it for context when deciding which tables are relevant.\nExpanded question:\n{question}\n\n"

# candidates_retrieval._llm_filter_candidates
candidate_filter:
  system_prompt: |-
    <role>
    ROLE : You are filtering candidate {candidate_type} for relevance to a user question.
    </role>

    <instructions>
    - Keep only candidates that could meaningfully contribute to answering the question.
    - Remove any candidate that shares no common domain, idea, or intent with the question.
    </instructions>

    <constraints>
    - CRITICAL NOTES : If none are relevant, return an empty list.
    </constraints>
  user_prompt: |-
    <inputs>
    <candidates>
    {candidates_block}
    </candidates>

    <user_question>
    {question}
    </user_question>
    </inputs>

    <tasks>
    From the candidates above, return the list of IDs to KEEP.
    </tasks>

# candidates_retrieval._llm_filter_both
combined_filter:
  system_prompt: |-
    <role>
    You are filtering two sets of candidates for relevance to a user question.
    </role>

    <instructions>
    - Keep only candidates that could meaningfully contribute to answering the question.
    - Remove any candidate that shares no common domain, idea, or intent with the question.
    </instructions>

    <constraints>
    - Treat the two sets separately.
    - If none in a set are relevant, use an empty list for that set.
    </constraints>
  user_prompt: |-
    <inputs>
    <custom_analyses>
    {custom_block}
    </custom_analyses>

    <sql_attributes>
    {sql_attr_block}
    </sql_attributes>

    <user_question>
    {question}
    </user_question>
    </inputs>

    <tasks>
    From the candidates above, return the IDs to KEEP for each set separately: one list for the custom analyses and one list for the SQL attributes.
    </tasks>

